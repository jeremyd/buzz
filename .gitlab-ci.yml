# GitLab CI for the relay.tools fork — builds distributable artifacts.
#
# Scope: Linux desktop bundles (deb + AppImage + binary tarball + Arch
# package + a devtools-enabled -debug binary/package variant), a
# cross-compiled Windows NSIS installer, and the signed Android APK. macOS/iOS need Apple runners this instance doesn't have; docker images
# are deliberately out of scope for now.
#
# Recipes are ported from .github/workflows/release.yml (release-linux job).
# Builds are unsigned on the Tauri-updater side (no TAURI_SIGNING_PRIVATE_KEY
# yet), which is fine because the default tauri.conf.json does not produce
# updater artifacts. Android release APKs are signed with the fork's upload
# keystore, vended via the BUZZ_ANDROID_UPLOAD_* CI variables.
#
# Binaries are published to the project's generic package registry
# (Deploy → Package registry) instead of job artifacts: the instance caps
# job artifacts at ~100 MB and the AppImage alone exceeds that. Package
# version comes from scripts/fork-version.sh: the tag when building a tag,
# else v<upstream desktop version>-<short-sha> (e.g. v0.5.5-abc12345),
# anchored on desktop/package.json so fork builds track upstream releases.

stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

desktop-linux:
  stage: build
  image: ubuntu:22.04
  timeout: 3h
  variables:
    DEBIAN_FRONTEND: noninteractive
    # AppImage tools are themselves AppImages; containers lack FUSE.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    # Keep hermit + cargo state inside the project dir so runner cache can hold it.
    # No CARGO_HOME here: hermit's rust package forces
    # CARGO_HOME=${HERMIT_ENV}/.hermit/rust (see rust.hcl in hermit-packages),
    # so cargo's registry/git caches land in .hermit/rust regardless.
    HERMIT_STATE_DIR: "$CI_PROJECT_DIR/.hermit-state"
  cache:
    key: desktop-linux-toolchain
    paths:
      - .hermit-state/
      - .hermit/rust/
    when: always
  before_script:
    - |
      apt-get update -o Acquire::Retries=3
      apt-get install -y --no-install-recommends \
        build-essential ca-certificates curl desktop-file-utils file git \
        libasound2-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
        libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config \
        squashfs-tools wget xdg-utils
    # Pinned appimagetool + type2 runtime (same pins as the GitHub release workflow).
    - |
      wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
        "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
      echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
      install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
      wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
        "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
      echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
      install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
      export APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - . ./bin/activate-hermit
  script:
    - just desktop-install-ci
    - cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
    - ./scripts/bundle-sidecars.sh
    - (cd desktop && pnpm tauri build --verbose --ci --bundles deb,appimage)
    - |
      export APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime
      APPIMAGE=$(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f | head -1)
      [ -n "$APPIMAGE" ] || { echo "No AppImage produced"; exit 1; }
      bash desktop/scripts/fix-appimage.sh "$APPIMAGE"
    - |
      mkdir -p dist
      cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/
      cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
    # Plain binary tarball: desktop app + CLI/sidecar binaries in one dir,
    # the same flat layout the deb installs into /usr/bin, so the desktop
    # binary finds its sidecars when run from the extracted directory.
    # A tarball (rather than loose binary uploads) keeps the +x bits intact.
    - |
      VERSION="$("${CI_PROJECT_DIR}/scripts/fork-version.sh")"
      STAGE="buzz-${VERSION}-linux-x86_64"
      mkdir -p "dist-bin/${STAGE}"
      cp target/release/buzz-acp target/release/buzz-agent target/release/buzz-dev-mcp \
         target/release/git-credential-nostr target/release/buzz \
         desktop/src-tauri/target/release/buzz-desktop \
         "dist-bin/${STAGE}/"
      strip "dist-bin/${STAGE}"/*
      tar --owner=0 --group=0 -C dist-bin -czf "dist/${STAGE}.tar.gz" "${STAGE}"
    # Debug variant: same release profile plus the `devtools` cargo feature, so
    # the shipped app has the WebKit inspector (right-click → Inspect Element,
    # JS console, network tab). Runs after the release bundles so it can't
    # contaminate them: it overwrites target/release/buzz-desktop, which the
    # release tarball above has already copied out. Binary-only (--no-bundle),
    # left unstripped for usable backtraces; sidecars ship in the main package
    # and resolve via PATH, so the tarball carries just the desktop binary,
    # renamed buzz-desktop-debug so both variants can coexist in /usr/bin.
    - (cd desktop && pnpm tauri build --verbose --ci --no-bundle --features devtools)
    - |
      DBGSTAGE="buzz-${VERSION}-debug-linux-x86_64"
      mkdir -p "dist-bin/${DBGSTAGE}"
      cp desktop/src-tauri/target/release/buzz-desktop "dist-bin/${DBGSTAGE}/buzz-desktop-debug"
      tar --owner=0 --group=0 -C dist-bin -czf "dist/${DBGSTAGE}.tar.gz" "${DBGSTAGE}"
      (cd dist && sha256sum * > SHA256SUMS)
      ls -lh dist/
    - |
      for f in dist/*; do
        NAME=$(basename "$f")
        URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzz-desktop-linux/${VERSION}/${NAME}"
        echo "Uploading ${NAME} -> ${URL}"
        curl --fail-with-body -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "$URL"
        echo
      done
      echo "Published under Deploy → Package registry → buzz-desktop-linux ${VERSION}"

# Repackages the binary tarball desktop-linux published into a pacman package
# (packaging/arch/PKGBUILD). Deliberately touches no Arch mirrors: everything
# makepkg needs ships in the base-devel image, the binaries come from our own
# registry, and the icons + .desktop file come from the repo checkout.
arch-pkg:
  stage: build
  image: archlinux:base-devel
  timeout: 30m
  needs: ["desktop-linux"]
  script:
    - |
      VERSION="$("${CI_PROJECT_DIR}/scripts/fork-version.sh")"
      # pacman versions cannot contain hyphens.
      PKGVER="$(printf '%s' "$VERSION" | tr - _)"
      TARBALL="buzz-${VERSION}-linux-x86_64.tar.gz"
      BUILD=/tmp/archbuild
      mkdir -p "$BUILD"
      sed -e "s/@PKGVER@/${PKGVER}/g" -e "s/@VERSION@/${VERSION}/g" \
        packaging/arch/PKGBUILD > "$BUILD/PKGBUILD"
      cp packaging/arch/buzz-desktop.desktop "$BUILD/"
      for s in 32x32 64x64 128x128; do
        cp "desktop/src-tauri/icons/${s}.png" "$BUILD/icon-${s}.png"
      done
      cp "desktop/src-tauri/icons/128x128@2x.png" "$BUILD/icon-256x256.png"
      cp desktop/src-tauri/icons/icon.png "$BUILD/icon-512x512.png"
      curl --fail-with-body -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" -o "$BUILD/$TARBALL" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzz-desktop-linux/${VERSION}/${TARBALL}"
      SUM=$(sha256sum "$BUILD/$TARBALL" | cut -d' ' -f1)
      sed -i "s/@SHA256@/${SUM}/" "$BUILD/PKGBUILD"
    # makepkg refuses to run as root; --nodeps because the depends are
    # runtime-only (we repackage prebuilt binaries) and installing them
    # would need Arch mirrors, which this job deliberately avoids.
    - useradd -m builder && chown -R builder /tmp/archbuild
    - su builder -c "cd /tmp/archbuild && makepkg --noconfirm --nodeps"
    - |
      VERSION="$("${CI_PROJECT_DIR}/scripts/fork-version.sh")"
      PKGFILE=$(find /tmp/archbuild -maxdepth 1 -name 'buzz-*.pkg.tar.zst' | head -1)
      [ -n "$PKGFILE" ] || { echo "No package produced"; exit 1; }
      NAME=$(basename "$PKGFILE")
      sha256sum "$PKGFILE"
      URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzz-desktop-linux/${VERSION}/${NAME}"
      echo "Uploading ${NAME} -> ${URL}"
      curl --fail-with-body -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$PKGFILE" "$URL"
      echo
      echo "Install with: sudo pacman -U ${NAME}"
    # Same recipe for the -debug companion package (buzz-desktop-debug, from
    # the devtools-enabled tarball; see PKGBUILD-debug for what it ships).
    - |
      VERSION="$("${CI_PROJECT_DIR}/scripts/fork-version.sh")"
      PKGVER="$(printf '%s' "$VERSION" | tr - _)"
      TARBALL="buzz-${VERSION}-debug-linux-x86_64.tar.gz"
      BUILD=/tmp/archbuild-debug
      mkdir -p "$BUILD"
      sed -e "s/@PKGVER@/${PKGVER}/g" -e "s/@VERSION@/${VERSION}/g" \
        packaging/arch/PKGBUILD-debug > "$BUILD/PKGBUILD"
      curl --fail-with-body -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" -o "$BUILD/$TARBALL" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzz-desktop-linux/${VERSION}/${TARBALL}"
      SUM=$(sha256sum "$BUILD/$TARBALL" | cut -d' ' -f1)
      sed -i "s/@SHA256@/${SUM}/" "$BUILD/PKGBUILD"
      chown -R builder "$BUILD"
      su builder -c "cd $BUILD && makepkg --noconfirm --nodeps"
      PKGFILE=$(find "$BUILD" -maxdepth 1 -name 'buzz-desktop-debug-*.pkg.tar.zst' | head -1)
      [ -n "$PKGFILE" ] || { echo "No debug package produced"; exit 1; }
      NAME=$(basename "$PKGFILE")
      sha256sum "$PKGFILE"
      URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzz-desktop-linux/${VERSION}/${NAME}"
      echo "Uploading ${NAME} -> ${URL}"
      curl --fail-with-body -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$PKGFILE" "$URL"
      echo
      echo "Install with: sudo pacman -U ${NAME} (runs as /usr/bin/buzz-desktop-debug)"

# Cross-compiles the Windows desktop app from a Linux pod — no Windows runner
# needed. Tauri v2 supports this officially (flagged experimental, NSIS only):
# cargo-xwin fetches the MSVC CRT + Windows SDK and drives clang-cl/lld-link,
# system makensis assembles the installer. Sidecar set matches upstream's
# windows-canary.yml (mesh-llm is deliberately excluded on Windows), and
# scripts/bundle-sidecars.sh already understands windows triples. The
# installer is unsigned, so SmartScreen shows an "unknown publisher" warning;
# WebView2 uses the default downloadBootstrapper mode (fetched at install
# time, not build time).
desktop-windows:
  stage: build
  # 24.04 (not 22.04 like desktop-linux): the linux job pins old glibc for
  # runtime compat, but this job emits Windows PE binaries, so prefer the
  # newer clang/lld for better MSVC compatibility.
  image: ubuntu:24.04
  timeout: 3h
  variables:
    DEBIAN_FRONTEND: noninteractive
    TARGET: x86_64-pc-windows-msvc
    # Same hermit/cargo cache story as desktop-linux (see comment there).
    HERMIT_STATE_DIR: "$CI_PROJECT_DIR/.hermit-state"
    # cargo-xwin unpacks the MSVC CRT + Windows SDK here; keep it inside the
    # project dir so runner cache holds it.
    XWIN_CACHE_DIR: "$CI_PROJECT_DIR/.xwin-cache"
    # aws-lc-sys ships CMake scripts older than hermit cmake 4.x's compat
    # floor; upstream's windows job sets the same escape hatch.
    CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  cache:
    key: desktop-windows-toolchain
    paths:
      - .hermit-state/
      - .hermit/rust/
      - .xwin-cache/
    when: always
  before_script:
    - |
      apt-get update -o Acquire::Retries=3
      apt-get install -y --no-install-recommends \
        build-essential ca-certificates clang curl file git lld llvm \
        nasm ninja-build nsis wget zip
    # Pinned cargo-xwin (prebuilt musl binary, same pin style as appimagetool).
    - |
      wget -q --tries=3 --timeout=30 -O /tmp/cargo-xwin.tar.gz \
        "https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.0/cargo-xwin-v0.23.0.x86_64-unknown-linux-musl.tar.gz"
      echo "74a216f64f10ea81c909f02d6b1a84cd0fda8de4c87ee52fe63ba76ab2392b75  /tmp/cargo-xwin.tar.gz" | sha256sum -c
      tar -C /usr/local/bin -xzf /tmp/cargo-xwin.tar.gz cargo-xwin
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - . ./bin/activate-hermit
    - rustup target add "$TARGET"
  script:
    - just desktop-install-ci
    - cargo xwin build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
    - ./scripts/bundle-sidecars.sh "$TARGET"
    # xwin lowercases the splatted SDK lib filenames, but the sherpa-onnx
    # prebuilt static libs embed a /DEFAULTLIB:"PathCch.lib" directive with
    # original casing, which lld-link can't resolve on a case-sensitive
    # filesystem. Scanning the prebuilt shows PathCch is its only mixed-case
    # directive. The splat exists by now (the sidecar build above created it).
    - ln -sf pathcch.lib .xwin-cache/xwin/sdk/lib/um/x86_64/PathCch.lib
    # CFLAGS: opus (audiopus_sys, huddle audio) compiles SSE4.1/SSSE3 files
    # with no arch flags because its CMake detects an MSVC frontend, which
    # tolerates that; clang-cl's backend enforces target features and errors.
    # -msse4.1 fixes it, at the cost of an SSE4.1 (2008+) CPU floor for the
    # desktop app's C deps — WebView2 (Chromium) effectively requires that
    # hardware anyway. Plain CFLAGS (not cc's CFLAGS_<target>) because
    # cargo-xwin injects a CMAKE_TOOLCHAIN_FILE, which makes the cmake crate
    # skip cc-derived flags; CMake itself still appends env CFLAGS at
    # configure time. Scoped to this step so the CLI zip keeps the default
    # baseline.
    - (cd desktop && CFLAGS="-msse4.1" CXXFLAGS="-msse4.1" pnpm tauri build --verbose --ci --runner cargo-xwin --target "$TARGET" --bundles nsis)
    - |
      VERSION="$("${CI_PROJECT_DIR}/scripts/fork-version.sh")"
      EXE=$(find "desktop/src-tauri/target/${TARGET}/release/bundle/nsis" -name '*.exe' -type f | head -1)
      [ -n "$EXE" ] || { echo "No NSIS installer produced"; exit 1; }
      mkdir -p dist
      cp "$EXE" "dist/buzz-${VERSION}-windows-x86_64-setup.exe"
    # CLI/sidecar bundle mirroring the Linux binary tarball, as a zip because
    # that's the native archive shape on Windows (no +x bits to preserve).
    - |
      VERSION="$("${CI_PROJECT_DIR}/scripts/fork-version.sh")"
      STAGE="buzz-${VERSION}-windows-x86_64"
      mkdir -p "dist-bin/${STAGE}"
      for bin in buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr buzz; do
        cp "target/${TARGET}/release/${bin}.exe" "dist-bin/${STAGE}/"
      done
      cp "desktop/src-tauri/target/${TARGET}/release/buzz-desktop.exe" "dist-bin/${STAGE}/"
      (cd dist-bin && zip -qr "../dist/${STAGE}.zip" "${STAGE}")
      (cd dist && sha256sum * > SHA256SUMS)
      ls -lh dist/
    - |
      VERSION="$("${CI_PROJECT_DIR}/scripts/fork-version.sh")"
      for f in dist/*; do
        NAME=$(basename "$f")
        URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzz-desktop-windows/${VERSION}/${NAME}"
        echo "Uploading ${NAME} -> ${URL}"
        curl --fail-with-body -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "$URL"
        echo
      done
      echo "Published under Deploy → Package registry → buzz-desktop-windows ${VERSION}"

android-apk:
  stage: build
  # Matches the hermit-pinned Flutter version (bin/.flutter-3.41.7.pkg).
  image: ghcr.io/cirruslabs/flutter:3.41.7
  timeout: 1h
  script:
    - test -n "$BUZZ_ANDROID_UPLOAD_KEYSTORE_B64" || { echo "Missing BUZZ_ANDROID_UPLOAD_KEYSTORE_B64 CI variable"; exit 1; }
    # The gradle config refuses keystores inside the repo — keep it in /tmp.
    - export BUZZ_ANDROID_UPLOAD_KEYSTORE_PATH="/tmp/upload-keystore.jks"
    - echo "$BUZZ_ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d > "$BUZZ_ANDROID_UPLOAD_KEYSTORE_PATH"
    - cd mobile
    - flutter --version
    - flutter pub get
    - flutter build apk --release
    - ls -lh build/app/outputs/flutter-apk/
    - |
      VERSION="$("${CI_PROJECT_DIR}/scripts/fork-version.sh")"
      APK="build/app/outputs/flutter-apk/app-release.apk"
      URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/buzz-android/${VERSION}/buzz-${VERSION}.apk"
      echo "Uploading APK -> ${URL}"
      curl --fail-with-body -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$APK" "$URL"
      echo
      echo "Published under Deploy → Package registry → buzz-android ${VERSION}"

# macOS DMG rides GitHub's hosted Apple runners (this instance has none):
# mirror-push the exact commit under build to the gitlab-ci branch of the
# github.com/jeremyd/buzz build-farm fork, then dispatch its
# fork-macos-build.yml pinned to that SHA. That workflow publishes the DMG
# back into THIS project's registry as buzz-desktop-macos with the same
# v<version>-<short sha> package version as the jobs above (it derives the
# version from the checked-out HEAD, matching scripts/fork-version.sh).
# GITHUB_MACOS_TRIGGER_TOKEN is a masked+protected CI variable (GitHub token
# with repo scope on jeremyd/buzz). Runs in parallel with the other build
# jobs; the macOS build takes ~15-30 min on GitHub's side.
trigger-macos:
  stage: build
  image: alpine:3.20
  timeout: 15m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # Full clone: pushing from a shallow checkout is rejected by the remote.
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git curl
    - git push --force "https://x-access-token:${GITHUB_MACOS_TRIGGER_TOKEN}@github.com/jeremyd/buzz.git" "HEAD:refs/heads/gitlab-ci"
    - |
      curl --fail-with-body -sS -X POST \
        -H "Authorization: Bearer ${GITHUB_MACOS_TRIGGER_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/jeremyd/buzz/actions/workflows/fork-macos-build.yml/dispatches" \
        -d "{\"ref\":\"main\",\"inputs\":{\"target\":\"aarch64-apple-darwin\",\"checkout_ref\":\"${CI_COMMIT_SHA}\"}}"
      echo "Dispatched fork-macos-build for ${CI_COMMIT_SHA} -> https://github.com/jeremyd/buzz/actions"
