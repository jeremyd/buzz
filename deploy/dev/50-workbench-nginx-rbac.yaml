# OPTIONAL — only needed with `ingress.mode: virtualserver` (F5 NGINX Ingress Controller).
# Lets the workbench service account manage F5 NGINX VirtualServer CRDs so `helm install`
# (run from the workbench) can create the relay's ingress. The bundled `admin` ClusterRole
# does not cover third-party CRD groups.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workbench-nginx-crds
  namespace: buzz
rules:
  - apiGroups: ["k8s.nginx.org"]
    resources: ["virtualservers", "virtualserverroutes", "policies", "transportservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workbench-nginx-crds
  namespace: buzz
subjects:
  - kind: ServiceAccount
    name: workbench
    namespace: buzz
roleRef:
  kind: Role
  name: workbench-nginx-crds
  apiGroup: rbac.authorization.k8s.io
